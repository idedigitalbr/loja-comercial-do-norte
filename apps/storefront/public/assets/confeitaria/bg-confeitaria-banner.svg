<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Base dark chocolate gradient -->
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#441418" />
      <stop offset="45%" stop-color="#380e12" />
      <stop offset="100%" stop-color="#28090c" />
    </linearGradient>

    <!-- Top left burgundy wave gradient -->
    <linearGradient id="topLeftGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#c5465e" />
      <stop offset="50%" stop-color="#9f2a3d" />
      <stop offset="100%" stop-color="#55121e" />
    </linearGradient>

    <!-- Bottom left burgundy wave gradient -->
    <linearGradient id="bottomLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b1334b" />
      <stop offset="60%" stop-color="#8a2034" />
      <stop offset="100%" stop-color="#4d0e19" />
    </linearGradient>

    <!-- Top right wave gradient -->
    <linearGradient id="topRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55121e" />
      <stop offset="100%" stop-color="#862134" />
    </linearGradient>

    <!-- Bottom right cream organic swoosh -->
    <linearGradient id="creamGrad" x1="0%" y1="30%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef5ed" />
      <stop offset="45%" stop-color="#f6ddc1" />
      <stop offset="100%" stop-color="#ebd0b0" />
    </linearGradient>
  </defs>

  <!-- Base background -->
  <rect width="1200" height="260" fill="url(#baseGrad)" />

  <!-- Wave 1: Top-left elegant curve -->
  <path d="M 0,0 L 0,65 C 60,70 140,65 240,40 C 290,25 320,10 350,0 Z" fill="url(#topLeftGrad)" />

  <!-- Wave 2: Bottom-left gentle curve (stays strictly below subtitle) -->
  <path d="M 0,260 L 0,218 C 70,222 160,234 240,248 C 265,253 285,257 300,260 Z" fill="url(#bottomLeftGrad)" />

  <!-- Wave 3: Top-right curve -->
  <path d="M 880,0 C 980,25 1090,55 1200,65 L 1200,0 Z" fill="url(#topRightGrad)" />

  <!-- Wave 4: Bottom-right cream organic swoosh -->
  <path d="M 960,260 C 1030,230 1110,195 1200,155 L 1200,260 Z" fill="url(#creamGrad)" />
</svg>